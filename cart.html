<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛒 Carrinho de Compras</h1>
    </header>
    <main>
        <div id="cart-items" class="cupcake-list"></div>
        <div style="text-align:center; margin-top: 20px;">
            <h3 id="total">Total: R$ 0,00</h3>
            <a href="payment.html" class="botao">Ir para Pagamento</a>
        </div>
    </main>
    <script>
        const container = document.getElementById("cart-items");
        const totalElement = document.getElementById("total");
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        function atualizarCarrinho() {
            container.innerHTML = "";
            let total = 0;

            if (carrinho.length === 0) {
                container.innerHTML = "<p>Seu carrinho está vazio.</p>";
            } else {
                carrinho.forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "cupcake";
                    const subtotal = item.preco * item.quantidade;
                    total += subtotal;
                    div.innerHTML = `
                        <img src="${item.imagem}" alt="${item.nome}">
                        <h3>${item.nome}</h3>
                        <p>${item.descricao}</p>
                        <p><strong>R$ ${item.preco.toFixed(2)}</strong></p>
                        <label>Qtd: <input type="number" min="1" value="${item.quantidade}" onchange="atualizarQtd(${index}, this.value)"></label><br>
                        <button onclick="removerItem(${index})" class="botao-remover">Remover</button>
                    `;
                    container.appendChild(div);
                });
            }
            totalElement.innerText = "Total: R$ " + total.toFixed(2);
        }

        function atualizarQtd(index, novaQtd) {
            carrinho[index].quantidade = parseInt(novaQtd);
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            atualizarCarrinho();
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            atualizarCarrinho();
        }

        atualizarCarrinho();
    </script>
</body>
</html>
